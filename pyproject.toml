[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herramientas-agentes"
version = "0.2.0"
description = "Suite académica modular: contrato común, CLI/REPL y composición"
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "mistune>=3.0.0",
    "python-pptx>=0.6.23",
    "jinja2>=3.1.0",
    "playwright>=1.40.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "lxml>=5.0.0",
    "xlsxwriter>=3.2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3.0"]
google = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.0"]

[project.scripts]
agente = "agente:main"

[tool.setuptools]
py-modules = ["agente", "sincronizar_skills"]

[tool.setuptools.packages.find]
include = ["nucleo*", "interfaces*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
strict = false
exclude = ["modulos/", "\\.venv/"]

[tool.coverage.run]
source = ["nucleo", "interfaces"]
